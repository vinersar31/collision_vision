# ============================================================================
# CollisionVision — training hyperparameters (optimized for fine-tuning
# pre-trained YOLOv8-Seg weights on a small car-damage dataset).
#
# Every key below (except `model`) is forwarded to Ultralytics
# `YOLO(model).train(...)`. See https://docs.ultralytics.com/modes/train/#arguments
# ============================================================================

# --- Model & data ----------------------------------------------------------
model: yolov8s-seg.pt          # pre-trained segmentation checkpoint to fine-tune
data: data/processed/data.yaml  # dataset descriptor generated by preprocessing

# --- Core schedule ---------------------------------------------------------
epochs: 100
imgsz: 640
batch: 16
patience: 30                    # early-stop after N epochs without improvement
device:                         # e.g. 0 / [0,1] / cpu / mps ; empty = auto
workers: 8
seed: 0

# --- Fine-tuning -----------------------------------------------------------
pretrained: true
freeze: 10                      # freeze the backbone (first 10 layers) for transfer learning
cos_lr: true                    # cosine LR schedule

# --- Optimizer -------------------------------------------------------------
optimizer: AdamW
lr0: 0.001                      # low base LR — we are fine-tuning, not training from scratch
lrf: 0.01                       # final LR = lr0 * lrf
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8

# --- Loss weights (segmentation) -------------------------------------------
box: 7.5
cls: 0.5
dfl: 1.5
overlap_mask: true
mask_ratio: 4

# --- Augmentation ----------------------------------------------------------
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
close_mosaic: 10                # disable mosaic for the last N epochs
mixup: 0.0
copy_paste: 0.3                 # segmentation-specific augmentation

# --- Output ----------------------------------------------------------------
# `project` is intentionally omitted: Ultralytics already saves to
# <runs_dir>/segment/<name> (e.g. runs/segment/collision_vision). Setting
# `project: runs/segment` here would duplicate the task folder in the path.
name: collision_vision
exist_ok: false
plots: true
val: true
