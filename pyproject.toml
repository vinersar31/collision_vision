[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collision-vision"
version = "0.1.0"
description = "Instance segmentation of post-accident car damage (dents, scratches, structural) with YOLOv8-Seg."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "CollisionVision" }]
keywords = ["computer-vision", "instance-segmentation", "yolov8", "car-damage", "ultralytics"]
dependencies = [
    "ultralytics>=8.1.0",
    "opencv-python>=4.8.0",
    "streamlit>=1.30.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
collision-vision = "collision_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
